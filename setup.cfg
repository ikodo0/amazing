[flake8]
extend-exclude = .venv,build,dist,.mypy_cache

[mypy]
exclude = (\.venv|build|dist|\.mypy_cache)/

# freetype and mlx ship no type information, so they are treated as untyped.
[mypy-freetype.*]
ignore_missing_imports = True

[mypy-mlx.*]
ignore_missing_imports = True

# Mlx is therefore Any, and Renderer has to subclass it.
[mypy-app.renderer.renderer]
disallow_subclassing_any = False
